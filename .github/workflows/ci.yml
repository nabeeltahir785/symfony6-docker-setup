# ============================================================================
# GitHub Actions CI — Symfony 6.4/7.0 + FrankenPHP
# Triggered on: push to main, pull requests
# ============================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: ci-password
  POSTGRES_DB: app_test
  APP_ENV: test
  APP_SECRET: ci-secret-key-not-for-production

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Code Quality (fast — no database needed)
  # --------------------------------------------------------------------------
  quality:
    name: "🔍 Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_pgsql, redis, zip, apcu
          tools: composer:v2, php-cs-fixer, phpstan
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint Symfony containers
        run: php bin/console lint:container

      - name: Lint YAML
        run: php bin/console lint:yaml config/

      - name: Lint Twig
        run: php bin/console lint:twig templates/ || true

      - name: PHPStan
        run: vendor/bin/phpstan analyse src tests --memory-limit=512M --no-progress

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Job 2: Test Suite (full Docker stack)
  # --------------------------------------------------------------------------
  test:
    name: "🧪 Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_pgsql, redis, zip, apcu
          tools: composer:v2
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create test database
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}?serverVersion=16&charset=utf8
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}?serverVersion=16&charset=utf8
          REDIS_URL: redis://localhost:6379
          MESSENGER_TRANSPORT_DSN: redis://localhost:6379/messages
          MAILER_DSN: null://null
        run: |
          php -d pcov.enabled=1 bin/phpunit \
            --colors=always \
            --coverage-clover var/coverage/clover.xml \
            --coverage-text \
            --log-junit var/coverage/junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: var/coverage/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Job 3: Docker Build Verification
  # --------------------------------------------------------------------------
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_prod
          push: false
          tags: symfony-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_test
          push: false
          tags: symfony-app:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
