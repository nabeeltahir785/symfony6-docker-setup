# config/packages/messenger.yaml
framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
                    delay: 1000
                    max_delay: 60000

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Route your messages to the async transport:
            # 'App\Message\YourMessage': async
