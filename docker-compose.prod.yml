# ============================================================================
# Production Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================================

services:

  app:
    build:
      target: frankenphp_prod
    restart: always
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      FRANKENPHP_WORKER_CONFIG: ""
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Remove source code bind mount — code is baked into the image

  worker:
    build:
      target: frankenphp_prod
    restart: always
    environment:
      APP_ENV: prod
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-v"]
    volumes: []
    # Remove source code bind mount — code is baked into the image

  # Remove Mailpit in production
  mailpit:
    profiles:
      - donotstart

volumes:
  caddy_data:
  caddy_config:
