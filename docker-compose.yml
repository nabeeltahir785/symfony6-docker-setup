# ============================================================================
# Symfony 6.4/7.0 — Docker Compose Orchestration
# Services: FrankenPHP (Caddy), PostgreSQL 16, Redis 7, Messenger Worker, Mailpit
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # PHP Application (FrankenPHP + Caddy)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-!ChangeThisAppSecret!}
      APP_DEBUG: ${APP_DEBUG:-1}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MAILER_DSN: smtp://mailpit:1025
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # FrankenPHP worker config
      FRANKENPHP_WORKER_CONFIG: ${FRANKENPHP_WORKER_CONFIG:-watch}
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config
      - app_var:/app/var
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3
      - "${HTTPS_PORT:-443}:443/udp"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony

  # --------------------------------------------------------------------------
  # Messenger Worker — Dedicated container for async message consumption
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-!ChangeThisAppSecret!}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MAILER_DSN: smtp://mailpit:1025
      WAIT_FOR_DB: "true"
      WORKER_CONTAINER: "true"
      # Skip auto-install — the app container handles it via shared bind mount
      SKIP_AUTO_INSTALL: "true"
    # Override CMD to run the Messenger consumer instead of the web server
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    volumes:
      - ./:/app
      - app_var:/app/var
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony

  # --------------------------------------------------------------------------
  # PostgreSQL 16 — Primary Database
  # --------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - symfony

  # --------------------------------------------------------------------------
  # Redis 7 — Cache & Message Broker
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - symfony

  # --------------------------------------------------------------------------
  # Mailpit — Local Email Testing (replaces MailHog)
  # --------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # Web UI
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - symfony

# ============================================================================
# Volumes — Persistent data storage
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  app_var:
    driver: local
  mailpit_data:
    driver: local

# ============================================================================
# Networks — Internal bridge network
# ============================================================================
networks:
  symfony:
    driver: bridge
    name: symfony_network