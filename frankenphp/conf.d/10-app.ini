; ============================================================================
; PHP Configuration — Base (shared by dev, test, prod)
; ============================================================================

[PHP]
; Date/Time
date.timezone = UTC

; Memory
memory_limit = 256M

; Upload
upload_max_filesize = 20M
post_max_size = 25M

; Session
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; OPcache (basic settings, overridden per environment)
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; APCu
apc.enable_cli = 1

; Realpath cache (Symfony has deep directory trees)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Expose
expose_php = Off
