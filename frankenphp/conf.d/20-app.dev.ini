; ============================================================================
; PHP Configuration — Development Overrides
; ============================================================================

[opcache]
; Revalidate on every request in dev
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

[xdebug]
; Xdebug — controlled by XDEBUG_MODE env var
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
; IDE key: set XDEBUG_IDE_KEY env var for VS Code (VSCODE) or other IDEs
xdebug.idekey = ${XDEBUG_IDE_KEY:-PHPSTORM}
