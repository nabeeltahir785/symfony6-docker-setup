; ============================================================================
; PHP Configuration — Production Overrides
; ============================================================================

[opcache]
; Never revalidate timestamps in production — deploy = restart
opcache.validate_timestamps = 0
; Preload Symfony container for zero-overhead boots
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data
; JIT compilation (tracing mode for maximum throughput)
opcache.jit = 1255
opcache.jit_buffer_size = 128M

[PHP]
; Suppress errors in response bodies
display_errors = Off
display_startup_errors = Off
; Log errors to stderr (captured by Docker logging driver)
log_errors = On
error_log = /dev/stderr
